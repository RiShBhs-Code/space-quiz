<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08142f">
  <title>Orbit Quiz — Space Exploration</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #edf6ff;
      --surface: rgba(255, 255, 255, .88);
      --surface-strong: #fff;
      --text: #101a3a;
      --muted: #52617d;
      --accent: #6547ef;
      --accent-dark: #4c32ce;
      --accent-soft: #e6e0ff;
      --border: #d7e1f1;
      --correct: #138a5b;
      --correct-bg: #d9f7e9;
      --wrong: #c33d57;
      --wrong-bg: #ffe1e6;
      --shadow: 0 24px 60px rgba(42, 60, 121, .16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #080f27;
        --surface: rgba(18, 28, 59, .9);
        --surface-strong: #131e40;
        --text: #f1f5ff;
        --muted: #aab7d6;
        --accent: #a997ff;
        --accent-dark: #c2b6ff;
        --accent-soft: #2b2554;
        --border: #2e3c68;
        --correct: #62e5a7;
        --correct-bg: #123c35;
        --wrong: #ff8da1;
        --wrong-bg: #4b2638;
        --shadow: 0 24px 60px rgba(0, 0, 0, .34);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 12%, rgba(115, 95, 255, .26), transparent 28rem),
        radial-gradient(circle at 90% 86%, rgba(38, 196, 209, .18), transparent 24rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .stars, .stars::before, .stars::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: "";
      background-image: radial-gradient(circle, rgba(255,255,255,.65) 1px, transparent 1px);
      background-size: 83px 83px;
      opacity: .1;
    }
    .stars::before { transform: translate(27px, 44px); background-size: 131px 131px; opacity: .45; }
    .stars::after { transform: translate(-19px, 17px); background-size: 211px 211px; opacity: .25; }

    main {
      width: min(100% - 2rem, 760px);
      margin: 0 auto;
      padding: 3rem 0 4rem;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .brand-mark { font-size: 1.5rem; }
    .brand-name { font-weight: 800; letter-spacing: .02em; }
    .score {
      padding: .45rem .8rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      font-size: .88rem;
      font-weight: 700;
    }
    .score strong { color: var(--text); }

    .card {
      padding: clamp(1.4rem, 4vw, 3rem);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: .55rem;
      color: var(--muted);
      font-size: .86rem;
      font-weight: 700;
    }
    .progress-track {
      height: .65rem;
      overflow: hidden;
      border-radius: 99px;
      background: var(--accent-soft);
    }
    .progress-value {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6547ef, #28c7cc);
      transition: width .45s ease;
    }

    .eyebrow {
      margin: 2.3rem 0 .55rem;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1, h2 { margin: 0; line-height: 1.12; }
    h1 { max-width: 18ch; font-size: clamp(1.8rem, 5vw, 3.1rem); }
    h2 { font-size: clamp(2rem, 5vw, 3.4rem); }
    .subtitle { margin: .9rem 0 0; color: var(--muted); }

    .answers {
      display: grid;
      gap: .8rem;
      margin-top: 2rem;
    }
    .answer {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .9rem;
      padding: 1rem 1.1rem;
      border: 2px solid var(--border);
      border-radius: 16px;
      color: var(--text);
      background: var(--surface-strong);
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: border-color .2s, background-color .2s, transform .2s;
    }
    .answer:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
    .answer:focus-visible, .restart:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    .answer-letter {
      display: grid;
      flex: 0 0 2rem;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 10px;
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 800;
    }
    .answer.correct { border-color: var(--correct); color: var(--correct); background: var(--correct-bg); }
    .answer.correct .answer-letter { color: var(--correct-bg); background: var(--correct); }
    .answer.wrong { border-color: var(--wrong); color: var(--wrong); background: var(--wrong-bg); }
    .answer.wrong .answer-letter { color: var(--wrong-bg); background: var(--wrong); }
    .answer:disabled { cursor: default; }

    .feedback {
      min-height: 1.6rem;
      margin: 1.2rem 0 0;
      font-weight: 800;
    }
    .feedback.correct { color: var(--correct); }
    .feedback.wrong { color: var(--wrong); }

    .shake { animation: shake .42s ease-in-out; }
    @keyframes shake {
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }

    .results { text-align: center; }
    .reaction { margin: 1rem 0 .4rem; font-size: 7rem; line-height: 1; }
    .results p { color: var(--muted); font-size: 1.1rem; }
    .result-score {
      display: inline-block;
      margin: 1rem 0;
      padding: .55rem 1.1rem;
      border-radius: 999px;
      color: var(--accent-dark);
      background: var(--accent-soft);
      font-weight: 800;
    }
    .restart {
      margin-top: 1rem;
      padding: .85rem 1.3rem;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: background-color .2s, transform .2s;
    }
    .restart:hover { background: var(--accent-dark); transform: translateY(-2px); }
    .hidden { display: none; }

    @media (max-width: 520px) {
      main { width: min(100% - 1rem, 760px); padding-top: 1.4rem; }
      .card { border-radius: 20px; padding: 1.25rem; }
      .eyebrow { margin-top: 1.7rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main>
    <header class="brand">
      <div><span class="brand-mark" aria-hidden="true">🪐</span> <span class="brand-name">Orbit Quiz</span></div>
      <div class="score" aria-live="polite">Score: <strong id="score">0</strong></div>
    </header>

    <section id="quiz-card" class="card" aria-labelledby="question">
      <div class="progress-meta">
        <span id="progress-label">Question 1 of 10</span>
        <span id="progress-percent">10%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1" aria-label="Quiz progress">
        <div id="progress-value" class="progress-value"></div>
      </div>

      <p class="eyebrow">Mission briefing</p>
      <h1 id="question" tabindex="-1"></h1>
      <p class="subtitle">Choose the best answer, space explorer.</p>
      <div id="answers" class="answers" role="group" aria-label="Answer choices"></div>
      <p id="feedback" class="feedback" aria-live="assertive"></p>
      <button id="next-question" class="restart hidden" type="button">Next question</button>
    </section>

    <section id="results-card" class="card results hidden" aria-labelledby="results-title" tabindex="-1">
      <div id="reaction" class="reaction" aria-hidden="true"></div>
      <p class="eyebrow">Mission complete</p>
      <h2 id="results-title">Stellar work!</h2>
      <p id="results-copy"></p>
      <div id="result-score" class="result-score"></div>
      <br>
      <button id="restart" class="restart" type="button">Launch again</button>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const questions = [
        { question: "Which planet is known as the Red Planet?", answers: ["Venus", "Mars", "Jupiter", "Mercury"], correct: 1, explanation: "Mars looks reddish because iron minerals in its surface have oxidized, or rusted." },
        { question: "What is the name of our galaxy?", answers: ["Andromeda", "Whirlpool", "Milky Way", "Sombrero"], correct: 2, explanation: "The Milky Way is a barred spiral galaxy containing our Sun and billions of other stars." },
        { question: "Which object sits at the center of our solar system?", answers: ["The Sun", "Earth", "The Moon", "Polaris"], correct: 0, explanation: "The Sun is the star at the center of our solar system, and its gravity keeps the planets in orbit." },
        { question: "What was the first human-made satellite called?", answers: ["Voyager 1", "Sputnik 1", "Apollo 11", "Hubble"], correct: 1, explanation: "The Soviet Union launched Sputnik 1 in 1957, beginning the Space Age." },
        { question: "How many moons does Earth have?", answers: ["One", "Two", "Twelve", "None"], correct: 0, explanation: "Earth has one natural satellite: the Moon." },
        { question: "What force keeps planets in orbit around the Sun?", answers: ["Magnetism", "Friction", "Gravity", "Light"], correct: 2, explanation: "The Sun's gravity pulls planets inward while their forward motion keeps them moving around it." },
        { question: "Which planet has the most prominent ring system?", answers: ["Saturn", "Neptune", "Uranus", "Mars"], correct: 0, explanation: "Saturn's bright, extensive rings are made mostly of ice, rock, and dust particles." },
        { question: "What is a light-year a measurement of?", answers: ["Time", "Brightness", "Distance", "Temperature"], correct: 2, explanation: "A light-year is the distance light travels in one year, about 9.46 trillion kilometers." },
        { question: "Which telescope launched in 2021 observes deep space?", answers: ["Kepler", "James Webb", "Galileo", "Spitzer"], correct: 1, explanation: "The James Webb Space Telescope studies distant galaxies, stars, and planets mainly in infrared light." },
        { question: "What do astronauts wear outside a spacecraft?", answers: ["A pressure suit", "A flight jacket", "A diving suit", "A thermal blanket"], correct: 0, explanation: "A spacesuit provides oxygen, pressure, temperature control, and protection from space hazards." }
      ];

      const quizCard = document.getElementById("quiz-card");
      const resultsCard = document.getElementById("results-card");
      const questionEl = document.getElementById("question");
      const answersEl = document.getElementById("answers");
      const feedbackEl = document.getElementById("feedback");
      const scoreEl = document.getElementById("score");
      const progressLabel = document.getElementById("progress-label");
      const progressPercent = document.getElementById("progress-percent");
      const progressValue = document.getElementById("progress-value");
      const progressBar = document.querySelector(".progress-track");
      const nextQuestion = document.getElementById("next-question");
      const resultReaction = document.getElementById("reaction");
      const resultTitle = document.getElementById("results-title");
      const resultCopy = document.getElementById("results-copy");
      const resultScore = document.getElementById("result-score");
      const restart = document.getElementById("restart");
      let current = 0;
      let score = 0;

      function renderQuestion() {
        const item = questions[current];
        const number = current + 1;
        const percent = Math.round((number / questions.length) * 100);
        questionEl.textContent = item.question;
        progressLabel.textContent = `Question ${number} of ${questions.length}`;
        progressPercent.textContent = `${percent}%`;
        progressValue.style.width = `${percent}%`;
        progressBar.setAttribute("aria-valuenow", number);
        progressBar.setAttribute("aria-valuetext", `${percent}% complete`);
        scoreEl.textContent = score;
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        nextQuestion.classList.add("hidden");
        answersEl.innerHTML = "";

        item.answers.forEach((answer, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.dataset.index = index;
          button.innerHTML = `<span class="answer-letter" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span>${answer}</span>`;
          button.addEventListener("click", () => chooseAnswer(index));
          answersEl.appendChild(button);
        });
        questionEl.focus();
      }

      function chooseAnswer(selected) {
        const item = questions[current];
        const buttons = [...answersEl.querySelectorAll(".answer")];
        buttons.forEach(button => { button.disabled = true; });
        buttons[item.correct].classList.add("correct");

        if (selected === item.correct) {
          score++;
          scoreEl.textContent = score;
          feedbackEl.textContent = `Correct — stellar navigation! ✨ Explanation: ${item.explanation}`;
          feedbackEl.className = "feedback correct";
        } else {
          buttons[selected].classList.add("wrong", "shake");
          feedbackEl.textContent = `Not quite — the answer is ${item.answers[item.correct]}. Explanation: ${item.explanation}`;
          feedbackEl.className = "feedback wrong";
        }

        nextQuestion.textContent = current === questions.length - 1 ? "View results" : "Next question";
        nextQuestion.classList.remove("hidden");
        nextQuestion.focus();
      }

      function advanceQuestion() {
        current++;
        if (current < questions.length) renderQuestion();
        else showResults();
      }

      function showResults() {
        const ratio = score / questions.length;
        const reaction = ratio === 1 ? "🌟" : ratio >= .7 ? "🚀" : ratio >= .4 ? "🌙" : "🛰️";
        resultReaction.textContent = reaction;
        resultTitle.textContent = ratio === 1 ? "Perfect orbit!" : ratio >= .7 ? "Stellar work!" : ratio >= .4 ? "Nice flight!" : "Keep exploring!";
        resultCopy.textContent = `You navigated ${questions.length} cosmic questions and scored ${score} ${score === 1 ? "point" : "points"}.`;
        animateResultScore();
        quizCard.classList.add("hidden");
        resultsCard.classList.remove("hidden");
        resultsCard.focus();
      }

      function animateResultScore() {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const start = performance.now();
        const duration = 900;

        function update(now) {
          const progress = reducedMotion ? 1 : Math.min((now - start) / duration, 1);
          const displayedScore = Math.round(score * progress);
          resultScore.textContent = `${displayedScore} / ${questions.length} correct`;
          if (progress < 1) window.requestAnimationFrame(update);
        }

        window.requestAnimationFrame(update);
      }

      nextQuestion.addEventListener("click", advanceQuestion);

      restart.addEventListener("click", () => {
        current = 0;
        score = 0;
        quizCard.classList.remove("hidden");
        resultsCard.classList.add("hidden");
        renderQuestion();
      });

      renderQuestion();
    })();
  </script>
</body>
</html>
